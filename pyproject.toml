[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mystery-algorithms"
version = "0.11.1"
description = "Independent calculation, rule analysis and optional interpretation modules"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT", "licenses/*"]
authors = [{name = "SaSa (SamanthaMengjunyu)"}]
dependencies = [
  "lunar-python==1.3.12",
  "pyswisseph==2.10.3.2",
  "tzdata==2026.2",
]

[project.optional-dependencies]
desktop = ["pywebview==6.2.1", "tzfpy==2.1.1"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
mystery-desktop = "desktop.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mystery*", "desktop*"]

[tool.setuptools.package-data]
"mystery.ziwei" = ["bridge.cjs", "vendor/*.js", "vendor/*.txt", "vendor/*.json"]
"desktop" = ["web/*.html", "web/*.css", "web/*.js", "web/vendor/*", "web/assets/*", "web/assets/geography/*", "web/assets/tarot-rws/*", "licenses/*"]
